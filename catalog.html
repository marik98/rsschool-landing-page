<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee House — Меню</title>
<link rel="icon" type="image/png" href="img/logo.png">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <div class="wrapper">

    <header class="header">
      <div class="container header__inner">
       <a href="index.html" class="logo" aria-label="Coffee House — на главную">
  <img src="img/logo.png" alt="Coffee House" width="100" height="60">
</a>

     <nav class="nav" id="nav" aria-label="Основная навигация">
  <ul class="nav__list">
    <li><a href="index.html" class="nav__link">Home</a></li>
    <li><a href="catalog.html" class="nav__link">Menu</a></li>
    <li><a href="#contacts" class="nav__link">Contact</a></li>
  </ul>
</nav>

<button class="burger" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="nav">
  <span class="burger__line"></span>
  <span class="burger__line"></span>
  <span class="burger__line"></span>
</button>

<button class="theme-toggle" type="button" aria-label="Переключить тему">
  <span class="theme-toggle__icon"></span>
</button>
      </div>
    </header>

    <main class="main">

     <section class="menu" id="menu">
  <div class="container">
    <h1 class="section-title">
      Behind each of our cups hides an <em>amazing surprise</em>
    </h1>

   <div class="tabs">
  <ul class="tabs__list">
    <li>
      <button class="tabs__btn tabs__btn--active" type="button" data-category="coffee">
        <svg class="tabs__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 8h16l-2 10H6L4 8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M9 8V6a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="2"/>
        </svg>
        Coffee
      </button>
    </li>
    <li>
      <button class="tabs__btn" type="button" data-category="tea">
        <svg class="tabs__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3v8M8 5v6M16 5v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M4 15h16v3a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        Tea
      </button>
    </li>
    <li>
      <button class="tabs__btn" type="button" data-category="dessert">
        <svg class="tabs__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 13h14v6H5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
          <path d="M7 13V9a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v4" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="5" r="1" fill="currentColor"/>
        </svg>
        Dessert
      </button>
    </li>
  </ul>
</div>

       <ul class="cards" id="cards"></ul>

    <button class="show-more" type="button">Show more</button>
  </div>
</section>

    </main>

   <footer class="footer" id="contacts">
  <div class="container footer__inner">
    <p class="footer__slogan">Sip, Savor, Smile.<br>It's coffee time!</p>

    <div class="footer__contact">
      <h3 class="footer__title">Contact us</h3>
      <ul class="footer__list">
        <li>
          <a href="https://maps.google.com/?q=8558+Green+Rd,+LA" class="footer__link" target="_blank" rel="noopener">
            8558 Green Rd., LA
          </a>
        </li>
        <li>
          <a href="tel:+16035550123" class="footer__link">
            +1 (603) 555-0123
          </a>
        </li>
      </ul>
    </div>

    <ul class="footer__socials">
      <li>
        <a href="https://t.me/" class="footer__social" aria-label="Telegram" target="_blank" rel="noopener">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M22 3L2 10.5l6 2 2 7 3.5-5 5 4L22 3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://instagram.com/" class="footer__social" aria-label="Instagram" target="_blank" rel="noopener">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.5"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
          </svg>
        </a>
      </li>
      <li>
        <a href="https://facebook.com/" class="footer__social" aria-label="Facebook" target="_blank" rel="noopener">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 3h-3a5 5 0 0 0-5 5v3H4v4h3v6h4v-6h3l1-4h-4V8a1 1 0 0 1 1-1h3V3z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>
        </a>
      </li>
    </ul>
  </div>
</footer>

    </div>

  <!-- Модальное окно -->
  <div class="modal" id="modal" aria-hidden="true">
    <div class="modal__overlay" data-close></div>
    <div class="modal__content" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal__close" type="button" aria-label="Закрыть" data-close>✕</button>
    <img class="modal__image" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Product" width="300" height="300">
      <h2 class="modal__title" id="modal-title">Product</h2>
      <p class="modal__desc"></p>

   <!-- Размер -->
<div class="modal__field">
  <h3 class="modal__field-title">Size</h3>
  <div class="modal__options" id="modalSizes"></div>
</div>

<!-- Добавки -->
<div class="modal__field">
  <h3 class="modal__field-title">Add-ons</h3>
  <div class="modal__addons" id="modalAddons">
    <!-- JS заполнит добавками в зависимости от категории -->
  </div>
</div>

<span class="modal__price"></span>
    </div>
  </div>

 <script src="js/products.js"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
